[package]
name = "recallgate-lock-x11"
description = "Recall Gate X11 grab lock client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
x11 = ["dep:x11rb", "dep:xkeysym"]

[[bin]]
name = "recallgate-lock-x11"
path = "src/main.rs"
required-features = ["x11"]

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
clap = { version = "=4.5.28", features = ["derive"] }
x11rb = { version = "0.13.1", features = ["randr"], optional = true }
xkeysym = { version = "0.2.1", optional = true }

[lints]
workspace = true
