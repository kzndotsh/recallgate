name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          components: rustfmt, clippy
      - name: Install system dependencies (lock crates and future daemon)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libsqlite3-dev
      - run: make check
